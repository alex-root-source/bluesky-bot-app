name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Initialize Clean Flutter App
        run: |
          rm -rf android ios lib test pubspec.yaml
          flutter create . --platforms=android --org=com.bluesky.bot

      - name: Restore Custom main.dart
        run: git checkout HEAD -- lib/main.dart

      - name: Add HTTP Dependency
        run: flutter pub add http

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bluesky-bot-app-release
          path: build/app/outputs/flutter-apk/app-debug.apk
          
