name: Build Kotlin Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android Project Structure
        run: |
          rm -rf * .github
          mkdir -p .github/workflows
          mkdir -p app/src/main/java/com/bluesky/bot
          mkdir -p app/src/main/res/layout

      - name: Inject Android Settings (build.gradle)
        run: |
          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.1.1'
                  classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.0'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.bluesky.bot'
              compileSdk 34

              defaultConfig {
                  applicationId "com.bluesky.bot"
                  minSdk 28
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.10.0'
              implementation 'com.squareup.okhttp3:okhttp:4.11.0'
              implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
          }
          EOF

          cat << 'EOF' > settings.gradle
          include ':app'
          rootProject.name = "BlueskyBot"
          EOF

      - name: Inject Android Manifest
        run: |
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="Bluesky Bot Hub"
                  android:theme="@style/Theme.Material3.Dark.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: Inject Kotlin MainActivity.kt
        run: |
          cat << 'EOF' > app/src/main/java/com/bluesky/bot/MainActivity.kt
          package com.bluesky.bot

          import android.os.Bundle
          import android.widget.Button
          import android.widget.EditText
          import android.widget.TextView
          import androidx.appcompat.app.AppCompatActivity
          import kotlinx.coroutines.*
          import okhttp3.*
          import okhttp3.MediaType.Companion.toMediaType
          import okhttp3.RequestBody.Companion.toRequestBody
          import org.json.JSONArray
          import org.json.JSONObject
          import java.time.LocalTime
          import java.time.format.DateTimeFormatter

          class MainActivity : AppCompatActivity() {

              private val client = OkHttpClient()
              private val scope = CoroutineScope(Dispatchers.Main + Job())

              private var accessJwt: String? = null
              private var userDid: String? = null
              private var isEngagementRunning = false

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  val handleInput = findViewById<EditText>(R.id.handleInput)
                  val passwordInput = findViewById<EditText>(R.id.passwordInput)
                  val loginBtn = findViewById<Button>(R.id.loginBtn)
                  val handlesInput = findViewById<EditText>(R.id.handlesInput)
                  val commentInput = findViewById<EditText>(R.id.commentInput)
                  val startBtn = findViewById<Button>(R.id.startBtn)
                  val stopBtn = findViewById<Button>(R.id.stopBtn)
                  val logText = findViewById<TextView>(R.id.logText)

                  fun addLog(msg: String) {
                      val time = LocalTime.now().format(DateTimeFormatter.ofPattern("HH:mm:ss"))
                      logText.append("[$time] $msg\n")
                  }

                  loginBtn.setOnClickListener {
                      val handle = handleInput.text.toString().trim()
                      val pass = passwordInput.text.toString().trim()
                      if (handle.isEmpty() || pass.isEmpty()) {
                          addLog("خطأ: يرجى إدخال البيانات كاملة")
                          return@setOnClickListener
                      }

                      scope.launch(Dispatchers.IO) {
                          try {
                              val json = JSONObject().apply {
                                  put("identifier", handle)
                                  put("password", pass)
                              }
                              val body = json.toString().toRequestBody("application/json".toMediaType())
                              val request = Request.Builder()
                                  .url("https://bsky.social/xrpc/com.atproto.server.createSession")
                                  .post(body)
                                  .build()

                              val response = client.newCall(request).execute()
                              val resStr = response.body?.string() ?: ""
                              if (response.isSuccessful) {
                                  val resJson = JSONObject(resStr)
                                  accessJwt = resJson.getString("accessJwt")
                                  userDid = resJson.getString("did")
                                  withContext(Dispatchers.Main) {
                                      addLog("تم تسجيل الدخول بنجاح!")
                                  }
                              } else {
                                  withContext(Dispatchers.Main) {
                                      addLog("فشل الدخول: $resStr")
                                  }
                              }
                          } catch (e: Exception) {
                              withContext(Dispatchers.Main) {
                                  addLog("خطأ شبكة: ${e.message}")
                              }
                          }
                      }
                  }

                  startBtn.setOnClickListener {
                      if (accessJwt == null) {
                          addLog("خطأ: سجل الدخول أولاً")
                          return@setOnClickListener
                      }

                      val handles = handlesInput.text.toString().split("\n").filter { it.trim().isNotEmpty() }
                      val comment = commentInput.text.toString().trim().ifEmpty { "شكراً لك" }

                      if (handles.isEmpty()) {
                          addLog("أدخل قائمة الحسابات")
                          return@setOnClickListener
                      }

                      isEngagementRunning = true
                      addLog("بدء التفاعل مع ${handles.size} حسابات...")

                      scope.launch(Dispatchers.IO) {
                          for (handle in handles) {
                              if (!isEngagementRunning) break
                              val cleanHandle = handle.trim().replace("@", "")

                              try {
                                  val resolveReq = Request.Builder()
                                      .url("https://bsky.social/xrpc/com.atproto.identity.resolveHandle?handle=$cleanHandle")
                                      .build()
                                  val resolveRes = client.newCall(resolveReq).execute()
                                  if (resolveRes.isSuccessful) {
                                      val targetDid = JSONObject(resolveRes.body?.string() ?: "").getString("did")

                                      val feedReq = Request.Builder()
                                          .url("https://bsky.social/xrpc/app.bsky.feed.getAuthorFeed?actor=$targetDid&limit=1")
                                          .addHeader("Authorization", "Bearer $accessJwt")
                                          .build()
                                      val feedRes = client.newCall(feedReq).execute()

                                      if (feedRes.isSuccessful) {
                                          val feedArray = JSONObject(feedRes.body?.string() ?: "").getJSONArray("feed")
                                          if (feedArray.length() > 0) {
                                              val post = feedArray.getJSONObject(0).getJSONObject("post")
                                              val postUri = post.getString("uri")
                                              val postCid = post.getString("cid")

                                              val replyRecord = JSONObject().apply {
                                                  put("text", comment)
                                                  put("createdAt", java.time.Instant.now().toString())
                                                  put("reply", JSONObject().apply {
                                                      put("root", JSONObject().apply {
                                                          put("uri", postUri)
                                                          put("cid", postCid)
                                                      })
                                                      put("parent", JSONObject().apply {
                                                          put("uri", postUri)
                                                          put("cid", postCid)
                                                      })
                                                  })
                                              }

                                              val createRecordJson = JSONObject().apply {
                                                  put("repo", userDid)
                                                  put("collection", "app.bsky.feed.post")
                                                  put("record", replyRecord)
                                              }

                                              val postBody = createRecordJson.toString().toRequestBody("application/json".toMediaType())
                                              val commentReq = Request.Builder()
                                                  .url("https://bsky.social/xrpc/com.atproto.repo.createRecord")
                                                  .addHeader("Authorization", "Bearer $accessJwt")
                                                  .post(postBody)
                                                  .build()

                                              val commentRes = client.newCall(commentReq).execute()
                                              if (commentRes.isSuccessful) {
                                                  withContext(Dispatchers.Main) { addLog("تم التعليق على $cleanHandle بنجاح!") }
                                              }
                                          }
                                      }
                                  }
                              } catch (e: Exception) {
                                  withContext(Dispatchers.Main) { addLog("خطأ مع $cleanHandle: ${e.message}") }
                              }

                              delay(10000) // فارق زمني 10 ثوانٍ
                          }
                          isEngagementRunning = false
                          withContext(Dispatchers.Main) { addLog("اكتملت العملية.") }
                      }
                  }

                  stopBtn.setOnClickListener {
                      isEngagementRunning = false
                      addLog("تم إيقاف العملية بطلب المستخدم.")
                  }
              }

              override fun onDestroy() {
                  super.onDestroy()
                  scope.cancel()
              }
          }
          EOF

      - name: Inject Android Layout XML
        run: |
          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <ScrollView xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#0F172A"
              android:padding="16dp">

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="vertical">

                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="Bluesky Kotlin Bot Hub"
                      android:textColor="#0085FF"
                      android:textSize="22sp"
                      android:textStyle="bold"
                      android:layout_gravity="center"
                      android:layout_marginBottom="16dp" />

                  <EditText
                      android:id="@+id/handleInput"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:hint="اسم المستخدم (user.bsky.social)"
                      android:textColor="#FFFFFF"
                      android:textColorHint="#94A3B8" />

                  <EditText
                      android:id="@+id/passwordInput"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:hint="كلمة مرور التطبيق"
                      android:inputType="textPassword"
                      android:textColor="#FFFFFF"
                      android:textColorHint="#94A3B8" />

                  <Button
                      android:id="@+id/loginBtn"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="تسجيل الدخول"
                      android:layout_marginTop="8dp" />

                  <EditText
                      android:id="@+id/handlesInput"
                      android:layout_width="match_parent"
                      android:layout_height="100dp"
                      android:hint="الحسابات المستهدفة (حساب في كل سطر)"
                      android:gravity="top"
                      android:textColor="#FFFFFF"
                      android:textColorHint="#94A3B8"
                      android:layout_marginTop="16dp" />

                  <EditText
                      android:id="@+id/commentInput"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:hint="نص التعليق"
                      android:textColor="#FFFFFF"
                      android:textColorHint="#94A3B8"
                      android:layout_marginTop="8dp" />

                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:orientation="horizontal"
                      android:layout_marginTop="12dp">

                      <Button
                          android:id="@+id/startBtn"
                          android:layout_width="0dp"
                          android:layout_height="wrap_content"
                          android:layout_weight="1"
                          android:text="بدء التفاعل"
                          android:backgroundTint="#4CAF50" />

                      <Button
                          android:id="@+id/stopBtn"
                          android:layout_width="0dp"
                          android:layout_height="wrap_content"
                          android:layout_weight="1"
                          android:text="إيقاف"
                          android:backgroundTint="#F44336"
                          android:layout_marginStart="8dp" />
                  </LinearLayout>

                  <TextView
                      android:id="@+id/logText"
                      android:layout_width="match_parent"
                      android:layout_height="200dp"
                      android:background="#1E293B"
                      android:textColor="#00FF66"
                      android:padding="8dp"
                      android:fontFamily="monospace"
                      android:textSize="12sp"
                      android:layout_marginTop="16dp" />

              </LinearLayout>
          </ScrollView>
          EOF

      - name: Setup Gradle Wrapper
        run: |
          gradle wrapper

      - name: Build Android Release/Debug APK via Gradle
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Kotlin APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bluesky-kotlin-bot
          path: app/build/outputs/apk/debug/app-debug.apk
