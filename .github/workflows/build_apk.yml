name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Initialize Clean App
        run: |
          rm -rf android ios pubspec.yaml
          flutter create . --project-name bluesky_bot_app --platforms=android --org=com.bluesky.bot
          flutter pub add http

      - name: Build APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: bluesky-bot-app
          path: build/app/outputs/flutter-apk/app-debug.apk
          
