name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Rebuild Project Structure
        run: |
          rm -rf android ios pubspec.yaml
          flutter create . --project-name bluesky_bot_app --platforms=android --org=com.bluesky.bot

      - name: Add HTTP Dependency
        run: flutter pub add http

      - name: Restore Custom Code
        run: git checkout HEAD -- lib/main.dart

      - name: Replace App Icons Direct
        run: |
          cp assets/logo.png android/app/src/main/res/mipmap-hdpi/ic_launcher.png 2>/dev/null || true
          cp assets/logo.png android/app/src/main/res/mipmap-mdpi/ic_launcher.png 2>/dev/null || true
          cp assets/logo.png android/app/src/main/res/mipmap-xhdpi/ic_launcher.png 2>/dev/null || true
          cp assets/logo.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png 2>/dev/null || true
          cp assets/logo.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png 2>/dev/null || true

      - name: Build APK
        run: flutter build apk --debug --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bluesky-bot-app-release
          path: build/app/outputs/flutter-apk/app-debug.apk
          
