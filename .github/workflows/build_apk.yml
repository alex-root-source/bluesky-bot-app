name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Android Skeleton
        run: flutter create . --platforms=android --org=com.bluesky.bot

      - name: Add HTTP Package
        run: flutter pub add http

      - name: Get Dependencies
        run: flutter pub get

      - name: Replace Default Android Icons with Logo
        run: |
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi
          cp assets/logo.png android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp assets/logo.png android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          cp assets/logo.png android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cp assets/logo.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp assets/logo.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Build APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bluesky-bot-app-release
          path: build/app/outputs/flutter-apk/app-debug.apk
          
