name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Flutter Stable
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Android Project & Set Min SDK 28 (Android 9+)
        run: |
          rm -rf android ios
          flutter create --platforms=android --org com.bluesky.bot .
          flutter pub add http
          
          # ضبط minSdkVersion إلى 28 (Android 9.0 Pie)
          sed -i 's/minSdkVersion .*/minSdkVersion 28/g' android/app/build.gradle || true
          sed -i 's/flutter.minSdkVersion/28/g' android/app/build.gradle || true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Debug APK
        run: flutter build apk --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bluesky-bot-app-android9
          path: build/app/outputs/flutter-apk/app-debug.apk
          
