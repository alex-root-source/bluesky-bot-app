name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Rebuild Android Clean Core
        run: |
          rm -rf android
          flutter create --platforms=android --org com.bluesky.bot .
          
          # Adjust minSdkVersion to 28 (Android 9.0+)
          sed -i 's/minSdkVersion .*/minSdkVersion 28/g' android/app/build.gradle || true
          sed -i 's/flutter.minSdkVersion/28/g' android/app/build.gradle || true

      - name: Fetch Dependencies
        run: flutter pub get

      - name: Build Debug APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bluesky-bot-app
          path: build/app/outputs/flutter-apk/app-debug.apk
          
