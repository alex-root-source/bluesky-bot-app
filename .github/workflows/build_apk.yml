name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Android Skeleton
        run: flutter create . --platforms=android --org=com.bluesky.bot

      - name: Add HTTP Package
        run: flutter pub add http

      - name: Add Launcher Icons Package
        run: flutter pub add --dev flutter_launcher_icons

      - name: Configure Launcher Icons
        run: |
          cat <<EOF >> pubspec.yaml

          flutter_launcher_icons:
            android: "launcher_icon"
            ios: false
            image_path: "assets/logo.png"
            min_sdk_android: 21
          EOF

      - name: Get Dependencies
        run: flutter pub get

      - name: Generate Launcher Icons
        run: flutter pub run flutter_launcher_icons

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bluesky-bot-app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          
